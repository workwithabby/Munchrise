<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="nav-title">
      <span class="nav-brand">Munch<span>rise</span></span>
    </ion-title>
    <span slot="end" class="nav-page">Reset</span>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page page--narrow stack">
    <div class="brand-block">
      <img class="brand-logo" src="assets/logo/munchrise-logo.png" alt="Munchrise" width="200" height="120" />
      <h1>Forgot your password?</h1>
      <p class="muted">No worries. Enter your email and we will send you a 6-digit code.</p>
    </div>

    <form class="form-stack" (submit)="$event.preventDefault(); sendCode()">
      <ion-input
        class="field"
        fill="outline"
        label="Email"
        labelPlacement="floating"
        type="email"
        autocomplete="email"
        inputmode="email"
        [value]="email()"
        (ionInput)="email.set($event.detail.value ?? '')">
      </ion-input>

      @if (formError()) {
        <p class="form-error" role="alert">
          <ion-icon name="alert-circle" aria-hidden="true"></ion-icon>
          {{ formError() }}
        </p>
      }

      <ion-button expand="block" type="submit" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          Sending…
        } @else {
          Send code
        }
      </ion-button>
    </form>

    <p class="forgot__back muted">
      Remembered it? <a routerLink="/login" class="forgot__link">Back to login</a>
    </p>
  </div>
</ion-content>
