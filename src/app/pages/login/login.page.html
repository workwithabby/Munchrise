<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/welcome" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="nav-title">
      <span class="nav-brand">Munch<span>rise</span></span>
    </ion-title>
    <span slot="end" class="nav-page">Login</span>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <div class="page page--narrow stack auth-fit">
    <div class="brand-block">
      <img class="brand-logo" src="assets/logo/munchrise-logo.png" alt="Munchrise" width="200" height="120" />
      <h1>Welcome back!</h1>
      <p class="muted">Log in to order, earn points and track deliveries.</p>
    </div>

    <form class="form-stack" (submit)="$event.preventDefault(); login()">
      <ion-input
        class="field"
        fill="outline"
        label="Email"
        labelPlacement="floating"
        type="email"
        autocomplete="email"
        inputmode="email"
        [value]="email()"
        (ionInput)="email.set($event.detail.value ?? '')">
      </ion-input>

      <ion-input
        class="field"
        fill="outline"
        label="Password"
        labelPlacement="floating"
        type="password"
        autocomplete="current-password"
        [value]="password()"
        (ionInput)="password.set($event.detail.value ?? '')">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>

      @if (formError()) {
        <p class="form-error" role="alert">
          <ion-icon name="alert-circle" aria-hidden="true"></ion-icon>
          {{ formError() }}
        </p>
      }

      <ion-button expand="block" type="submit" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          Logging in…
        } @else {
          Login
        }
      </ion-button>
    </form>

    <div class="divider"><span>or</span></div>

    <div class="btn-stack">
      <ion-button expand="block" fill="outline" routerLink="/signup">Create an account</ion-button>
      <ion-button expand="block" fill="clear" color="dark" (click)="continueAsGuest()">
        Continue as Guest
      </ion-button>
    </div>

    <p class="callout">
      <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
      Your password is sent securely and is never shown to anyone.
    </p>
  </div>
</ion-content>
