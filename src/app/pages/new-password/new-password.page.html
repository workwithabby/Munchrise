<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/forgot-password" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="nav-title">
      <span class="nav-brand">Munch<span>rise</span></span>
    </ion-title>
    <span slot="end" class="nav-page">New password</span>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page page--narrow stack">
    <div class="brand-block">
      <span class="np__badge" aria-hidden="true"><ion-icon name="checkmark-circle"></ion-icon></span>
      <h1>Code verified</h1>
      <p class="muted">Now choose a new password for your account.</p>
    </div>

    <form class="form-stack" (submit)="$event.preventDefault(); save()">
      <ion-input
        class="field"
        fill="outline"
        label="New password"
        labelPlacement="floating"
        type="password"
        autocomplete="new-password"
        helperText="At least 8 characters"
        [value]="password()"
        (ionInput)="password.set($event.detail.value ?? '')">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        class="field"
        fill="outline"
        label="Confirm new password"
        labelPlacement="floating"
        type="password"
        autocomplete="new-password"
        [value]="confirm()"
        (ionInput)="confirm.set($event.detail.value ?? '')">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (formError()) {
        <p class="form-error" role="alert">
          <ion-icon name="alert-circle" aria-hidden="true"></ion-icon>
          {{ formError() }}
        </p>
      }

      <ion-button expand="block" type="submit" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          Saving…
        } @else {
          Save new password
        }
      </ion-button>
    </form>

    <p class="callout">
      <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
      After saving, you are signed in right away.
    </p>
  </div>
</ion-content>
